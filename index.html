<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b2b">
<title>BlissAI — Material You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #101b2b;
  --surface: #172538;
  --surface-container: #1d2d42;
  --surface-high: #263950;
  --surface-low: #131f30;
  --outline: #40556b;
  --text: #e4edf7;
  --muted: #a9b9c9;
  --primary: #75dce7;
  --on-primary: #00363d;
  --secondary: #b3d9c1;
  --user: #174e5a;
  --assistant: #1b3046;
  --error: #ffb4ab;
  --radius: 28px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); }
body { min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; border: 0; background: transparent; outline: none !important; box-shadow: none !important; }

.material-symbols-rounded {
  font-family: 'Material Symbols Rounded';
  font-weight: normal;
  font-style: normal;
  font-size: 22px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.md-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 14px;
  transition: opacity 0.2s, background-color 0.2s;
  outline: none !important;
}
.md-btn:active { opacity: 0.8; }
.md-btn-filled { background: var(--primary); color: var(--on-primary); }
.md-btn-tonal { background: var(--surface-high); color: var(--text); }
.md-btn-outlined { border: 1px solid var(--outline); background: transparent; color: var(--text); }
.md-icon-btn { width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--primary); }
.md-icon-btn:hover { background: rgba(255, 255, 255, 0.08); }

.app { min-height: 100dvh; }
.topbar { height: 76px; position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(20px); border-bottom: 1px solid #ffffff12; }
.top-inner { max-width: 1480px; height: 100%; padding: 0 22px; margin: auto; display: flex; align-items: center; gap: 14px; }
.brand-icon { height: 44px; width: 44px; border-radius: 16px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.brand { font-size: 22px; font-weight: 900; line-height: 1; }
.tagline { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 3px; }
.spacer { flex: 1; }
.top-actions { display: flex; align-items: center; gap: 10px; }

.lang-wrap { position: relative; }
.lang-menu { position: absolute; right: 0; top: 54px; z-index: 40; width: 220px; max-height: 340px; overflow: auto; padding: 8px; border-radius: 22px; background: var(--surface-container); border: 1px solid var(--outline); box-shadow: 0 14px 40px #0005; display: none; }
.lang-menu.open { display: block; }
.lang-option { width: 100%; border: 0; background: transparent; color: var(--text); padding: 10px 12px; text-align: left; border-radius: 14px; font-weight: 800; }
.lang-option:hover, .lang-option.active { background: var(--surface-high); color: var(--primary); }

.layout { max-width: 1480px; margin: auto; padding: 20px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; min-height: calc(100dvh - 76px); }
.sidebar { position: sticky; top: 96px; height: calc(100dvh - 116px); min-height: 440px; padding: 16px; background: var(--surface); border: 1px solid #ffffff10; border-radius: var(--radius); display: flex; flex-direction: column; overflow-y: auto; }
.new-chat { width: 100%; }
.section-label { margin: 18px 10px 8px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 900; }
.history { overflow: auto; display: grid; gap: 5px; max-height: 180px; }
.history-empty { padding: 10px; color: var(--muted); text-align: center; font-size: 12px; }
.history-item { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 12px; border: 0; border-radius: 15px; background: transparent; color: var(--text); text-align: left; width: 100%; }
.history-item:hover, .history-item.active { background: var(--surface-high); }
.history-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 800; }
.delete-chat { border: 0; background: transparent; color: var(--muted); border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; }
.delete-chat:hover { background: #ffffff15; color: var(--error); }

.side-settings { border-top: 1px solid #ffffff16; padding-top: 12px; display: grid; gap: 8px; margin-top: 10px; }
.side-field { display: grid; gap: 4px; }
.side-field label { font-size: 11px; color: var(--muted); font-weight: 800; }
.side-field input, .side-field select { width: 100%; padding: 8px 10px; border: 1px solid var(--outline); border-radius: 12px; background: var(--surface-low); color: var(--text); font-size: 13px; outline: none; }

.side-bottom { border-top: 1px solid #ffffff16; padding-top: 10px; display: grid; gap: 4px; margin-top: 10px; }
.side-action { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 15px; background: transparent; color: var(--muted); font-weight: 900; text-align: left; }
.side-action:hover { background: var(--surface-high); color: var(--primary); }

.main { min-width: 0; min-height: calc(100dvh - 116px); display: flex; flex-direction: column; }
.welcome { width: min(100%, 800px); margin: auto; text-align: center; padding: 40px 18px 60px; }
.welcome-badge { display: inline-flex; align-items: center; gap: 9px; padding: 9px 17px; border-radius: 999px; background: #20483d; color: var(--secondary); font-size: 13px; font-weight: 900; }
.welcome h1 { font-size: clamp(40px, 6vw, 72px); line-height: 1.05; letter-spacing: -1.8px; font-weight: 900; margin: 28px 0 18px; }
.accent { color: var(--primary); }
.welcome p { max-width: 650px; margin: 0 auto 30px; color: var(--muted); font-size: clamp(16px, 2vw, 20px); line-height: 1.65; }
.welcome-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

.chat { width: min(100%, 920px); margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.messages { flex: 1; min-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 16px; padding: 18px 8px 22px; }
.empty-chat { margin: auto; padding: 25px; text-align: center; color: var(--muted); line-height: 1.7; }
.message { display: flex; align-items: flex-start; gap: 10px; max-width: 88%; animation: rise 0.18s ease; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.avatar { width: 36px; height: 36px; flex: none; border-radius: 14px; background: var(--surface-high); color: var(--primary); display: grid; place-items: center; }
.message.user .avatar { background: #205764; color: #d5fbff; }
.bubble { min-width: 0; padding: 12px 16px; border-radius: 8px 22px 22px 22px; background: var(--assistant); line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.message.user .bubble { background: var(--user); border-radius: 22px 8px 22px 22px; }
.bubble img { display: block; max-width: min(100%, 320px); max-height: 230px; object-fit: contain; border-radius: 15px; margin-bottom: 8px; }
.typing { color: var(--primary); font-weight: 900; }

.composer-area { position: sticky; bottom: 0; padding: 14px 0 max(12px, env(safe-area-inset-bottom)); background: var(--bg); }
.composer { padding: 10px; border: 1px solid var(--outline); border-radius: 26px; background: var(--surface); backdrop-filter: blur(18px); }
.previews { display: flex; gap: 10px; flex-wrap: wrap; padding: 3px 7px 10px; }
.preview { position: relative; }
.preview img { width: 66px; height: 66px; object-fit: cover; border-radius: 15px; }
.preview button { position: absolute; right: -5px; top: -5px; width: 23px; height: 23px; border: 0; border-radius: 50%; background: var(--surface-high); color: var(--text); }
.compose-row { display: flex; align-items: flex-end; gap: 8px; }
.compose-row textarea { flex: 1; min-width: 0; min-height: 46px; max-height: 150px; resize: none; padding: 12px 8px; background: transparent; border: 0; color: var(--text); outline: none; }
.compose-row textarea::placeholder { color: var(--muted); }
.send-button { height: 48px; width: 48px; flex: none; border: 0; border-radius: 17px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.send-button:disabled { opacity: 0.45; cursor: not-allowed; }
.hint { text-align: center; color: var(--muted); opacity: 0.7; font-size: 11px; margin-top: 8px; }

.scrim { position: fixed; inset: 0; background: #0008; z-index: 29; display: none; }
.scrim.open { display: block; }
.mobile-menu { display: none; }

.toast { position: fixed; z-index: 10000; left: 50%; bottom: 22px; transform: translate(-50%, 18px); opacity: 0; pointer-events: none; background: #d7f5ed; color: #07383e; padding: 11px 18px; border-radius: 999px; font-weight: 900; transition: 0.2s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
[hidden] { display: none !important; }
body.compact .messages { gap: 8px; }
body.light { color-scheme: light; --bg: #edf4f8; --surface: #f6fbff; --surface-container: #e3edf5; --surface-high: #d4e3ed; --surface-low: #f8fcff; --outline: #aabdc9; --text: #142b3b; --muted: #536c7c; --assistant: #dce9f1; --user: #bfe7e9; }

@media(max-width: 800px) {
  .layout { display: block; padding: 12px; min-height: calc(100dvh - 68px); }
  .topbar { height: 68px; }
  .top-inner { padding: 0 13px; gap: 9px; }
  .brand { font-size: 19px; }
  .tagline { display: none; }
  .mobile-menu { display: inline-grid; }
  .sidebar { position: fixed; z-index: 30; top: 78px; left: 12px; bottom: 12px; width: min(300px, calc(100vw - 48px)); height: auto; min-height: 0; transform: translateX(calc(-100% - 25px)); transition: transform 0.22s ease; box-shadow: 0 16px 50px #0006; }
  .sidebar.open { transform: translateX(0); }
  .main { min-height: calc(100dvh - 92px); }
  .welcome { padding: 34px 12px 45px; }
  .welcome h1 { font-size: clamp(39px, 10vw, 58px); }
  .chat { min-height: calc(100dvh - 110px); }
  .message { max-width: 94%; }
  .btn-text { display: none; }
}
</style>
</head>

<div class="app">

            <span id="lang-label">RU</span>
            <span class="material-symbols-rounded">expand_more</span>

  <div class="scrim" id="scrim" data-action="sidebar-close"></div>

      </div>
    </aside>

    <main class="main">
      <section class="welcome" id="welcome">
        <div class="welcome-badge">

            <span data-i18n="startChat">Начать разговор</span>
          </button>
        </div>
      </section>

      <section class="chat" id="chat" hidden>
        <div class="messages" id="messages"></div>
        <div class="composer-area">
          <div class="composer">
            <div class="previews" id="previews"></div>
            <div class="compose-row">

              <button class="md-icon-btn" data-action="attach" aria-label="Attach image">

              <button class="send-button" data-action="send" aria-label="Send">
                <span class="material-symbols-rounded">arrow_upward</span>
              </button>
            </div>
          </div>
          <div class="hint" data-i18n="disclaimer">BlissAI может ошибаться. Проверяй важную информацию.</div>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=tr(e.dataset.i18nPlaceholder));
  $('lang-label').textContent=LANGS.find(x=>x[0]===lang)?.[1]||'RU';
  $('lang-menu').innerHTML=LANGS.map(x=>`<button class="lang-option ${x[0]===lang?'active':''}" data-language="${x[0]}">${x[1]} · ${x[2]}</button>`).join('');
  renderHistory();
  renderMessages();
}

function renderHistory(){
  const root=$('history');
  if(!chats.length){root.innerHTML=`<div class="history-empty">${esc(tr('empty'))}</div>`;return}
  root.innerHTML=chats.slice().sort((a,b)=>b.updated-a.updated).map(c=>`
    <div class="history-item ${c.id===activeId?'active':''}" data-chat="${esc(c.id)}">
      <span class="material-symbols-rounded">chat_bubble</span>
      <span class="title">${esc(c.title||tr('newTitle'))}</span>
      <button class="delete-chat" data-delete="${esc(c.id)}" aria-label="Delete">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  `).join('');
}

function renderMessages(){
  const chat=current();
  $('welcome').hidden=!!chat;
  $('chat').hidden=!chat;
  if(!chat)return;
  const root=$('messages');
  if(!chat.messages.length){root.innerHTML=`<div class="empty-chat">${esc(tr('welcome'))}</div>`;return}
  root.innerHTML=chat.messages.map(m=>`
    <article class="message ${m.role==='user'?'user':''}">
      <div class="avatar"><span class="material-symbols-rounded">${m.role==='user'?'person':'auto_awesome'}</span></div>
      <div class="bubble">${(m.images||[]).map(src=>`<img src="${src}" alt="Attached image">`).join('')}${esc(m.content||'')}</div>
    </article>
  `).join('');
  root.scrollTop=root.scrollHeight;
}

function newChat(){
  const c={id:id(),title:tr('newTitle'),messages:[],updated:Date.now()};
  chats.push(c);
  activeId=c.id;
  persist();
  renderHistory();
  renderMessages();
  closeSidebar();
  $('prompt').focus();
}

function closeSidebar(){$('sidebar').classList.remove('open');$('scrim').classList.remove('open')}

function saveSettingsToStorage(){
  localStorage.setItem('bliss.endpoint', $('api-endpoint').value.trim()||'https://api.mistral.ai/v1/chat/completions');
  localStorage.setItem('bliss.model', $('api-model').value.trim()||'mistral-small-latest');
}

async function send(){
  const input=$('prompt'),text=input.value.trim();
  if((!text&&!attachments.length)||sending)return;
  
  saveSettingsToStorage();
  const key=getKey();
  if(!current())newChat();
  
  const chat=current(),images=attachments.map(x=>x.data);
  chat.messages.push({role:'user',content:text,images});
  if(chat.messages.length===1)chat.title=(text||tr('imageOnly')).slice(0,40);
  chat.updated=Date.now();
  persist();
  
  input.value='';
  input.style.height='auto';
  attachments=[];
  renderPreviews();
  renderHistory();
  renderMessages();
  
  sending=true;
  $('[data-action="send"]')?.setAttribute('disabled','');
  
  const wait=document.createElement('article');
  wait.className='message';
  wait.innerHTML=`<div class="avatar"><span class="material-symbols-rounded">auto_awesome</span></div><div class="bubble typing">${esc(tr('thinking'))}</div>`;
  $('messages').append(wait);
  
  try{
    const model = $('api-model').value.trim() || 'mistral-small-latest';
    const url = $('api-endpoint').value.trim() || 'https://api.mistral.ai/v1/chat/completions';
    
    const messages = [
      ...chat.messages.map(m => {
        if (m.role === 'assistant') {
          return { role: 'assistant', content: m.content };
        }
        if (m.images?.length) {
          return {
            role: 'user',
            content: [
              { type: 'text', text: m.content || 'Опиши изображение' },
              ...m.images.map(img => ({ type: 'image_url', image_url: { url: img } }))
            ]
          };
        }
        return { role: 'user', content: m.content };
      })
    ];

    const r = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${key}`
      },
      body: JSON.stringify({ model, messages, max_tokens: 2000 })
    });
    
    if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));
    const data = await r.json();
    const answer = data.choices?.[0]?.message?.content;
    if(typeof answer!=='string'||!answer.trim())throw new Error('Empty response');
    chat.messages.push({role:'assistant',content:answer});
  }catch(e){
    console.error(e);
    chat.messages.push({role:'assistant',content:tr('sendError')+'\n'+e.message});
  }finally{
    chat.updated=Date.now();
    persist();
    sending=false;
    $('[data-action="send"]')?.removeAttribute('disabled');
    renderMessages();
    renderHistory();
  }
}

function renderPreviews(){
  $('previews').innerHTML=attachments.map((a,i)=>`<div class="preview"><img src="${a.data}" alt="Preview"><button data-remove-image="${i}" aria-label="${esc(tr('removeImage'))}"><span class="material-symbols-rounded">close</span></button></div>`).join('');
}

async function pickImages(files){
  for(const file of Array.from(files||[])){
    if(!file.type.startsWith('image/'))continue;
    if(file.size>8*1024*1024){toast(tr('imageBig'));continue}
    try{
      const raw=await new Promise((resolve,reject)=>{
        const r=new FileReader();
        r.onload=()=>resolve(r.result);
        r.onerror=reject;
        r.readAsDataURL(file);
      });
      const data=await new Promise(resolve=>{
        const img=new Image();
        img.onload=()=>{
          const scale=Math.min(1,1280/Math.max(img.width,img.height));
          const canvas=document.createElement('canvas');
          canvas.width=Math.max(1,Math.round(img.width*scale));
          canvas.height=Math.max(1,Math.round(img.height*scale));
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          resolve(canvas.toDataURL('image/jpeg',.78));
        };
        img.onerror=()=>resolve(raw);
        img.src=raw;
      });
      attachments.push({name:file.name,data});
    }catch(err){console.error(err)}
  }
  renderPreviews();
}

function clearChats(){
  if(!confirm(tr('confirmClear')))return;
  chats=[];activeId=null;persist();renderHistory();renderMessages();closeSidebar();toast(tr('cleared'));
}

function action(name,target){
  switch(name){
    case'new-chat':newChat();break;
    case'lang-toggle':$('lang-menu').classList.toggle('open');break;
    case'attach':$('file-input').click();break;
    case'send':send();break;
    case'clear-chats':clearChats();break;
    case'sidebar-toggle':$('sidebar').classList.add('open');$('scrim').classList.add('open');break;
    case'sidebar-close':closeSidebar();break;
  }
}

document.addEventListener('click',e=>{
  const a=e.target.closest?.('[data-action]');
  if(a){e.preventDefault();action(a.dataset.action,a.dataset.target);return}
  const l=e.target.closest?.('[data-language]');
  if(l){lang=l.dataset.language;localStorage.setItem('bliss.lang',lang);$('lang-menu').classList.remove('open');translate();return}
  const d=e.target.closest?.('[data-delete]');
  if(d){e.stopPropagation();const key=d.dataset.delete;chats=chats.filter(c=>c.id!==key);if(activeId===key)activeId=chats[0]?.id||null;persist();renderHistory();renderMessages();toast(tr('deleted'));return}
  const c=e.target.closest?.('[data-chat]');
  if(c){activeId=c.dataset.chat;persist();renderHistory();renderMessages();closeSidebar();return}
  const rm=e.target.closest?.('[data-remove-image]');
  if(rm){attachments.splice(Number(rm.dataset.removeImage),1);renderPreviews();return}
  if(!e.target.closest?.('.lang-wrap'))$('lang-menu').classList.remove('open');
});

$('file-input').addEventListener('change',e=>{pickImages(e.target.files);e.target.value=''});
$('prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,150)+'px'});
$('prompt').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    $('lang-menu').classList.remove('open');
    closeSidebar();
  }
});

if(activeId&&!chats.some(c=>c.id===activeId))activeId=null;
$('api-endpoint').value = localStorage.getItem('bliss.endpoint') || 'https://api.mistral.ai/v1/chat/completions';
$('api-model').value = localStorage.getItem('bliss.model') || 'mistral-small-latest';

translate();
renderMessages();
})();
</script>
</body>
</html>
